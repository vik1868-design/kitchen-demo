services:
  - type: web
    name: kitchen-api
    runtime: node
    region: ohio
    buildCommand: cd api && npm install
    startCommand: cd api && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kitchen-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001

  - type: web
    name: kitchen-frontend
    runtime: docker
    region: ohio
    dockerfilePath: frontend/Dockerfile
    envVars:
      - key: VITE_API_URL
        fromService:
          name: kitchen-api
          property: renderURL

databases:
  - name: kitchen-db
    databaseName: kitchen
    user: kitchen
    plan: free
