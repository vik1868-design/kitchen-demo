version: "3.9"

services:
  # ── PostgreSQL database ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: kitchen
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kitchen_demo_pw}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kitchen-network

  # ── Express API ──────────────────────────────────────────────
  api:
    build: ./api
    restart: always
    environment:
      DATABASE_URL: postgres://kitchen:${DB_PASSWORD:-kitchen_demo_pw}@db:5432/kitchen
      JWT_SECRET: ${JWT_SECRET:-super_secret_demo_key_change_in_production}
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kitchen-network

  # ── React frontend (nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${API_URL:-http://localhost:3001}
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - kitchen-network

volumes:
  pgdata:

networks:
  kitchen-network:
    driver: bridge
